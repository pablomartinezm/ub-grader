name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you manually publishing? (note only for audit)'
        required: false
        default: 'manual trigger'
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for OIDC trusted publisher

jobs:
  pypi:
    name: Build & Publish (PyPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build dists
        run: python -m build
      - name: Publish (PyPI)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          print-hash: true
          # Uses PyPI Trusted Publisher OIDC
